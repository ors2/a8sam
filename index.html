<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأقسام</title>
<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
  margin:0;
}

h1 { margin-top:20px; }

input {
  padding:10px;
  width:80%;
  margin:20px;
  border-radius:8px;
  border:none;
}

.card {
  background:#222;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

a {
  color:white;
  text-decoration:none;
  display:block;
  font-size:18px;
}
</style>
</head>

<body>

<h1>📚 لوحة الاختبارات</h1>

<input id="search" placeholder="ابحث عن قسم..." />

<div id="list"></div>

<script>
const chapters = [];

for(let i=1;i<=225;i++){
  chapters.push({ id:i, title:"القسم " + i });
}

function render(data){
  document.getElementById("list").innerHTML =
    data.map(c=>`
      <div class="card">
        <a href="quiz.html?chapter=${c.id}">${c.title}</a>
      </div>
    `).join("");
}

render(chapters);

document.getElementById("search").oninput = function(){
  render(chapters.filter(c=>c.title.includes(this.value)));
};
</script>

</body>
</html>
