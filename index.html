<h1>لوحة الاختبارات</h1>

<input id="search" placeholder="ابحث عن قسم..." />

<div id="list"></div>

<script>
const chapters = [];

for (let i = 1; i <= 225; i++) {
  chapters.push({
    id: i,
    title: "القسم " + i,
    link: "chapter" + i + ".html"
  });
}

function render(list){
  document.getElementById("list").innerHTML =
    list.map(c => `
      <div style="padding:10px;margin:10px;background:#222;color:white">
        <a style="color:white" href="${c.link}">${c.title}</a>
      </div>
    `).join("");
}

render(chapters);

document.getElementById("search").oninput = function(){
  const val = this.value;
  render(chapters.filter(c => c.title.includes(val)));
};
</script>
