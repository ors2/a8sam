<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأقسام</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  color:white;
  background:url("dth.jpg") no-repeat center center fixed;
  background-size:cover;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
}

.container{
  position:relative;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:20px;
}

a{
  width:100px;
  padding:15px;
  background:#111;
  border:1px solid #444;
  border-radius:10px;
  color:white;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>📚 الأقسام</h1>

<div class="container" id="list"></div>

<script>
for(let i=1;i<=225;i++){
  document.getElementById("list").innerHTML +=
    `<a href="quiz.html?chapter=${i}">القسم ${i}</a>`;
}
</script>

</body>
</html>
