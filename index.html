<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الاختبارات</title>
<style>
body { font-family: Arial; background:#111; color:white; text-align:center; }
.card { background:#222; margin:10px; padding:10px; border-radius:10px; }
a { color:white; text-decoration:none; display:block; }
input { padding:10px; width:80%; margin:20px; }
</style>
</head>

<body>

<h1>📚 لوحة الاختبارات</h1>

<input id="search" placeholder="ابحث عن قسم..." />

<div id="list"></div>

<script>
const chapters = [];

// نسوي 225 قسم تلقائي
for(let i=1;i<=225;i++){
  chapters.push({
    id:i,
    title:"القسم " + i
  });
}

function render(data){
  document.getElementById("list").innerHTML =
    data.map(c=>`
      <div class="card">
        <a href="#" onclick="openChapter(${c.id})">${c.title}</a>
      </div>
    `).join("");
}

function openChapter(id){
  alert("هنا بيفتح اختبار القسم رقم " + id);
  // لاحقًا نحط أسئلة كل قسم هنا
}

render(chapters);

document.getElementById("search").oninput = function(){
  render(chapters.filter(c=>c.title.includes(this.value)));
};
</script>

</body>
</html>
