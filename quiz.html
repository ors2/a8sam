<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
  background: url("dth.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle {
  color: #ccc;
}

#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  font-size: 20px;
}

.door:hover {
  transform: scale(1.07);
}

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
}

#timerBox {
  font-size: 26px;
  margin: 110px auto 10px;
  padding: 14px 22px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: bold;
  color: white;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">a8sam</div>

<div id="question"></div>
<div class="doors" id="doors"></div>
<div id="timerBox">الوقت: 0:00</div>

<div class="footer">py precisely</div>

<script>

const chapter = new URLSearchParams(window.location.search).get("chapter");

const allQuestions = {
1: [
{
q:"ثوب : جسم",
options:["قبعة : رأس","قدم : حذاء","قماش : خياط","خشب : طاولة"],
correct:"قبعة : رأس"
},
{
q:"شظف : رخاء",
options:["إذاعة : تلفاز","بذل : عطاء","بذور : جذور","قسوة : لين"],
correct:"قسوة : لين"
},
{
q:"قلم : كتابة",
options:["تعليم : معلم","رسام : رسم","حصاد : حصادة","تحذير : محذر"],
correct:"رسام : رسم"
},
{
q:"حصان : مضمار",
options:["طائرة : سماء","سفينة : بحر","قطار : سكة","سيارة : طريق"],
correct:"قطار : سكة"
},
{
q:"إذا جلست للناس فكن ....... لقلبك ولنفسك ولا يغرنك اجتماعهم عليك فإنهم يراقبون ظاهرك والله تعالى ....... باطنك.",
options:["مقلباً - يبصر","واعظاً - يراقب","مجتهداً - يرى","مستخدماً - يشاهد"],
correct:"واعظاً - يراقب"
},
{
q:"الطلاقة ....... ملكة تعين الإنسان على حسن ....... والإقناع.",
options:["الفكرية - الاستماع","اللفظية - التعبير","الشعرية - التواري","الحسية - الاستنطاق"],
correct:"اللفظية - التعبير"
},
{
q:"يفهم من النص أن يكون الإنسان:",
options:["مستقلا","تابعا","ناجحا","متغيراً"],
correct:"مستقلا"
}
]
};

let questions = allQuestions[chapter] || [];
let current = 0;
let locked = false;
let wrong = [];

/* TIMER */
let startTime = Date.now();
setInterval(()=>{
let sec = Math.floor((Date.now()-startTime)/1000);
let m = Math.floor(sec/60);
let s = sec%60;
document.getElementById("timerBox").innerText =
"الوقت: " + m + ":" + (s<10?"0"+s:s);
},1000);

function show(){
locked = false;

let q = questions[current];

if(!q){
endScreen();
return;
}

document.getElementById("question").innerText = q.q;

let box = document.getElementById("doors");
box.innerHTML = "";

q.options.forEach(opt=>{
let d = document.createElement("div");
d.className = "door";
d.innerText = opt;

d.onclick = ()=>check(opt,d,q);

box.appendChild(d);
});
}

function check(opt, door, q){
if(locked) return;
locked = true;

if(opt === q.correct){
door.classList.add("correct");
}else{
door.classList.add("wrong");
wrong.push({q:q.q, options:q.options, your:opt, correct:q.correct});
}

setTimeout(()=>{
current++;
show();
},500);
}

function endScreen(){
document.getElementById("question").innerHTML = "انتهى الاختبار 🔥";
document.getElementById("doors").innerHTML = "";

if(wrong.length > 0){
let html = "<h2>الأخطاء:</h2>";

wrong.forEach(e=>{
html += `
<div style="background:#111;margin:10px;padding:10px;border-radius:10px">
<p>${e.q}</p>
<p style="color:red">إجابتك: ${e.your}</p>
<p style="color:lime">الصحيح: ${e.correct}</p>
</div>
`;
});

document.getElementById("question").innerHTML = html;
}
}

show();

</script>

</body>
</html>
